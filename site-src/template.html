<style>
:root {

  --live: #1e7a4c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16150f;
    --panel: #201e17;
    --text: #e8e4dc;
    --muted: #a09a8e;
    --accent: #e06c5a;
    --accent-soft: #3a2320;
    --blue: #7fb0d8;
    --link: #e08a7a;
    --border: #37342b;
    --ext-bg: #1a2129;
    --ext-border: #2c3d4d;
    --ext-mark: #7fb0d8;
    --code: #26241c;
    --live: #6fbf95;
  }
}
* { box-sizing: border-box; }
.skip-link { position: absolute; left: -9999px; top: 0; z-index: 10; background: var(--panel); color: var(--text); padding: .5rem .9rem; border: 1px solid var(--border); border-radius: 0 0 6px 0; }
.skip-link:focus { left: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 1rem; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
h1, h2, h3, h4 { font-family: Georgia, "Times New Roman", serif; line-height: 1.25; }

.masthead { border-bottom: 3px double var(--border); background: var(--panel); }
.masthead-inner { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.2rem 1.2rem; }
.masthead h1 { margin: 0; font-size: 2.4rem; letter-spacing: .04em; color: var(--accent); }
.masthead h1 .isca { color: var(--blue); font-size: 1.1rem; letter-spacing: .12em; display: block; font-family: system-ui, sans-serif; font-weight: 600; text-transform: uppercase; margin-bottom: .2rem; }
.tagline { margin: .3rem 0 0; font-size: 1.05rem; color: var(--muted); font-style: italic; }
.motto { margin: .5rem 0 0; font-size: .92rem; color: var(--muted); }
.motto strong { color: var(--text); }
.banner {
  margin: .9rem 0 0; padding: .6rem .8rem; border: 1px solid var(--accent);
  background: var(--accent-soft); border-radius: 6px; font-size: .88rem; color: var(--text);
}
.searchwrap { margin-top: .9rem; }
#search {
  width: 100%; max-width: 30rem; padding: .5rem .8rem; font-size: .95rem;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text);
}
#search:focus { outline: 2px solid var(--blue); border-color: transparent; }
.search-note { font-size: .8rem; color: var(--muted); margin-top: .3rem; display: none; }

.layout { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1.2rem 3rem; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 2.2rem; }
.toc-toggle { display: none; }
nav.toc { position: sticky; top: 1rem; align-self: start; max-height: calc(100vh - 2rem); overflow-y: auto; font-size: .88rem; padding-right: .4rem; }
nav.toc .toc-head { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; color: var(--muted); margin: 1rem 0 .35rem; }
nav.toc a { display: block; padding: .16rem 0; color: var(--text); border-left: 2px solid transparent; }
nav.toc a.sub { padding-left: 1rem; color: var(--muted); }
nav.toc a:hover { color: var(--link); text-decoration: none; }
nav.toc a.active { color: var(--accent); border-left-color: var(--accent); padding-left: .4rem; font-weight: 600; }
nav.toc a.sub.active { padding-left: 1.4rem; }

main { min-width: 0; overflow-wrap: break-word; }
section.topic { margin-bottom: 2.6rem; }
section.topic > h2 {
  font-size: 1.7rem; margin: 0 0 .2rem; padding-bottom: .25rem;
  border-bottom: 2px solid var(--accent); color: var(--text);
}
section.topic .srcline { font-size: .78rem; color: var(--muted); margin: .25rem 0 .8rem; }
section.subtopic { margin: 1.6rem 0 0 0; padding-left: 1rem; border-left: 3px solid var(--border); }
section.subtopic > h3 { font-size: 1.25rem; margin: 0 0 .2rem; color: var(--text); }
.intro p { margin: .4rem 0; color: var(--text); }
.intro { margin-bottom: .6rem; }

.orig-head, .ext-head {
  display: flex; align-items: center; gap: .5rem; margin: 1rem 0 .4rem;
  font-size: .78rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
}
.orig-head { color: var(--accent); }
.ext-head { color: var(--ext-mark); }
.orig-head::after, .ext-head::after { content: ""; flex: 1; height: 1px; background: var(--border); }

ul.orig { list-style: none; margin: 0; padding: 0; }
ul.orig > li { margin: 0 0 .55rem; padding-left: 1.1rem; position: relative; }
ul.orig > li::before { content: "●"; position: absolute; left: 0; top: .1em; font-size: .6rem; color: var(--accent); }
ul.orig .res-links a { font-weight: 600; }
ul.orig .res-links a + a::before { content: " · "; color: var(--muted); font-weight: 400; }
.archived { font-size: .82rem; }
.archived a { color: var(--muted); border-bottom: 1px dotted var(--muted); }
.deadnote { font-size: .82rem; color: var(--muted); }

.group-head { font-weight: 700; font-size: .95rem; margin: 1rem 0 .35rem; color: var(--text); font-family: Georgia, serif; }

.lectures { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: .45rem; margin: .6rem 0; }
.lecture { border: 1px solid var(--border); border-radius: 6px; padding: .45rem .6rem; font-size: .86rem; background: var(--panel); }
.lecture .lt { display: block; margin-bottom: .1rem; color: var(--text); }
.lecture a { font-weight: 600; }
.lecture a + a::before { content: " · "; color: var(--muted); font-weight: 400; }

.ext-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem; margin: 0; }
.ext-item {
  border: 1px solid var(--ext-border); border-radius: 8px; background: var(--ext-bg);
  padding: .55rem .8rem; font-size: .92rem;
}
.ext-item .et { font-weight: 700; }
.ext-item .eo { color: var(--muted); font-size: .84rem; }
.ext-item .ed { margin: .15rem 0 0; }
.ext-item .em { margin-top: .2rem; font-size: .76rem; color: var(--muted); }
.ext-item .em span { background: var(--code); border-radius: 4px; padding: .05rem .4rem; margin-right: .3rem; display: inline-block; }

section.extended-intro { margin: 3rem 0 1rem; padding: 1rem 1.2rem; border: 1px dashed var(--ext-border); border-radius: 10px; background: var(--ext-bg); }
section.extended-intro h2 { margin: 0 0 .3rem; font-size: 1.35rem; color: var(--ext-mark); }
section.extended-intro p { margin: 0; font-size: .92rem; color: var(--muted); }

footer { border-top: 3px double var(--border); background: var(--panel); margin-top: 2rem; }
.footer-inner { max-width: 1180px; margin: 0 auto; padding: 1.8rem 1.2rem 2.4rem; font-size: .9rem; }
.footer-inner h2 { font-size: 1.2rem; margin: 1.4rem 0 .4rem; }
.footer-inner h2:first-child { margin-top: 0; }

.footer-inner p strong { color: var(--text); }

}
.contact-btn:hover { text-decoration: none; opacity: .92; }
.changelog { list-style: none; padding: 0; margin: .4rem 0 0; }
.changelog li { margin: .3rem 0; padding-left: 1rem; position: relative; color: var(--muted); }
.changelog li::before { content: "—"; position: absolute; left: 0; }
.changelog .cd { font-weight: 600; color: var(--text); }
.built { margin-top: 1.6rem; font-size: .78rem; color: var(--muted); }

.atlas-stats { display:flex; flex-wrap:wrap; gap:1.4rem; margin:.7rem 0; }
.atlas-stats .stat { font-size:.85rem; color:var(--muted); }
.atlas-stats b { display:block; font:600 1.5rem Georgia,serif; color:var(--text); }
.callout { border:1px solid var(--ext-border); background:var(--ext-bg); padding:1rem; }
.hidden { display: none !important; }
.fhide { display: none !important; }
@media (prefers-reduced-motion: reduce) {

}
@media (max-width: 860px) {

  }

  .js nav.toc.open { display: block; }
  .masthead h1 { font-size: 1.9rem; }
}

<script>
(function () {
  document.documentElement.classList.add('js');
  var input = document.getElementById('search');
  var note = document.getElementById('searchNote');
  var items = Array.from(document.querySelectorAll('[data-origin][data-search]'));
  var sections = Array.from(document.querySelectorAll('section.topic, section.subtopic')).filter(function (el) { return el.id !== 'benchmark-atlas'; });
  var headers = Array.from(document.querySelectorAll('.orig-head, .ext-head, .group-head, .extended-intro'));
  var sourceButtons = Array.from(document.querySelectorAll('[data-source]'));
  var source = 'all';
  var tocToggle = document.getElementById('tocToggle');
  var topicNav = document.getElementById('topicNav');
  var normalize = function (value) { return value.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[-–—/]/g, ' '); };
  function setTocOpen(open) {
    topicNav.classList.toggle('open', open);
    tocToggle.setAttribute('aria-expanded', String(open));
    tocToggle.textContent = open ? 'Hide topics' : 'Browse topics';
  }
  tocToggle.addEventListener('click', function () { setTocOpen(!topicNav.classList.contains('open')); });
  function applyFilter(saveUrl) {
    var words = normalize(input.value.trim()).split(/\s+/).filter(Boolean);
    var active = words.length > 0 || source !== 'all';
    var shown = 0;
    document.body.classList.toggle('filtering', active);
    items.forEach(function (el) {
      var haystack = normalize(el.getAttribute('data-search'));
      var hit = (source === 'all' || el.dataset.origin === source) && words.every(function (word) { return haystack.includes(word); });
      el.classList.toggle('hidden', !hit);
      if (hit) shown++;
    });
    sections.forEach(function (el) { el.classList.toggle('hidden', active && !el.querySelector('[data-origin]:not(.hidden)')); });
    headers.forEach(function (el) {
      var visible = false;
      var sibling = el.nextElementSibling;
      while (sibling && !sibling.matches('.orig-head,.ext-head,.group-head,.extended-intro,section.subtopic')) {
        if (sibling.matches('[data-origin]:not(.hidden)') || sibling.querySelector('[data-origin]:not(.hidden)')) { visible = true; break; }
        sibling = sibling.nextElementSibling;
      }
      if (el.classList.contains('extended-intro')) visible = ['paralinguistics','clinical','community'].some(function (id) { return !document.getElementById(id).classList.contains('hidden'); });
      el.classList.toggle('hidden', active && !visible);
    });
    sourceButtons.forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.source === source)); });
    document.getElementById('emptyState').hidden = shown > 0;
    note.textContent = shown + ' of ' + items.length + ' resources' + (active ? ' match' : ' available');
    topicNav.querySelectorAll('a[href^="#"]').forEach(function (link) {
      var section = document.getElementById(link.hash.slice(1));
      var hidden = section && section.classList.contains('hidden');
      link.classList.toggle('no-matches', !!hidden);
    });
    if (saveUrl) {
      var url = new URL(window.location.href);
      input.value.trim() ? url.searchParams.set('q', input.value.trim()) : url.searchParams.delete('q');
      source !== 'all' ? url.searchParams.set('source', source) : url.searchParams.delete('source');
      history.replaceState(null, '', url);
    }
  }
  function resetFilters(focus) { input.value = ''; source = 'all'; applyFilter(true); if (focus) input.focus(); }
  input.addEventListener('input', function () { applyFilter(true); });
  input.addEventListener('keydown', function (event) { if (event.key === 'Escape') { event.preventDefault(); resetFilters(true); } });
  sourceButtons.forEach(function (button) { button.addEventListener('click', function () { source = button.dataset.source; applyFilter(true); }); });
  document.getElementById('clearSearch').addEventListener('click', function () { resetFilters(true); });
  document.getElementById('resetEmpty').addEventListener('click', function () { resetFilters(true); });
  document.addEventListener('click', function (event) {
    var link = event.target.closest('a[href^="#"]');
    if (!link) return;
    var target = document.getElementById(link.hash.slice(1));
    if (target && (target.closest('.hidden') || target.id === 'welcome' || target.id === 'benchmark-atlas')) resetFilters(false);
    if (topicNav.contains(link) && window.matchMedia('(max-width:860px)').matches) {
      setTocOpen(false);
      if (target) { target.setAttribute('tabindex', '-1'); target.focus({preventScroll:true}); }
    }
  });
  var params = new URLSearchParams(window.location.search);
  input.value = params.get('q') || '';
  if (['original','extension'].includes(params.get('source'))) source = params.get('source');
  applyFilter(false);
  var tocLinks = Array.from(topicNav.querySelectorAll('a[href^="#"]'));
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        tocLinks.forEach(function (link) { var current = link.hash === '#' + entry.target.id; link.classList.toggle('active', current); if (current) link.setAttribute('aria-current','location'); else link.removeAttribute('aria-current'); });
      });
    }, { rootMargin:'0px 0px -70% 0px' });
    document.querySelectorAll('section[id]').forEach(function (section) { observer.observe(section); });
  }

  // Benchmark Atlas card: refresh baked counts from the atlas's same-origin
  // stats.json (it rebuilds daily); the baked snapshot stays as the fallback.
  var baCard = document.querySelector('.ba-card[data-stats-url]');
  if (baCard && window.fetch) {
    fetch(baCard.getAttribute('data-stats-url'), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (s) {
        if (!s) return;
        Array.prototype.forEach.call(baCard.querySelectorAll('[data-ba-stat]'), function (el) {
          var v = s[el.getAttribute('data-ba-stat')];
          if (typeof v === 'number') el.textContent = v.toLocaleString('en-US');
        });
        var asof = baCard.querySelector('[data-ba-asof]');
        if (asof && typeof s.built_at === 'string' && /^\d{4}-\d{2}-\d{2}/.test(s.built_at)) {
          asof.textContent = s.built_at.slice(0, 10);
        }
      })
      .catch(function () { /* offline or blocked: keep the baked snapshot */ });
  }
})();
</script>
</body>
</html>
